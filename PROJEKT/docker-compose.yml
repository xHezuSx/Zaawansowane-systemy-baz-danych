services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: his_oracle_db
    restart: unless-stopped
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_SYS_PASSWORD:-SysPassword123!}
      - APP_USER=${ORACLE_APP_USER:-his_admin}
      - APP_USER_PASSWORD=${ORACLE_APP_PASSWORD:-HisPassword123!}
      - ORACLE_DATABASE=${ORACLE_PDB:-FREEPDB1}
    volumes:
      - oracle_his_data:/opt/oracle/oradata
      - ./init-scripts:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  etl-service:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: his_etl_service
    restart: "no"
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      - ORACLE_HOST=oracle-db
      - ORACLE_PORT=1521
      - ORACLE_SERVICE_NAME=${ORACLE_PDB:-FREEPDB1}
      - ORACLE_USER=${ORACLE_APP_USER:-his_admin}
      - ORACLE_PASSWORD=${ORACLE_APP_PASSWORD:-HisPassword123!}
    volumes:
      - ./etl/data:/app/data

volumes:
  oracle_his_data:
    name: oracle_his_data
